<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Council ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEFF1; --sheet:#F7F8F9; --ink:#182029; --ink-2:#5B6570; --rule:#C9CED4;
  --chair:#2B4C7E; --human:#A8681A; --conflict:#8A2D2D; --ok:#3E6B4A;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--chair);outline-offset:3px}
.tag{font-family:var(--sans);font-size:12.5px;line-height:1;color:var(--ink-2);letter-spacing:0}
.id{font-family:var(--sans);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.mark{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:6px}
.mark.chair{background:var(--chair)} .mark.human{background:var(--human)} .mark.conflict{background:var(--conflict)} .mark.finding{background:var(--ink)} .mark.gap{background:transparent;border:1.5px solid var(--ink-2)}

/* Header */
header{padding:40px 48px 24px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
header h1{font-size:40px;font-weight:600;line-height:1.05;margin:0 0 8px;letter-spacing:-0.01em}
header .meta{font-family:var(--sans);font-size:14px;color:var(--ink-2)}
.views{display:flex;gap:2px;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.views button{padding:9px 16px;font-family:var(--sans);font-size:14px;background:var(--sheet)}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* Numbers strip */
.strip{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--rule)}
.strip div{padding:18px 48px 18px;border-right:1px solid var(--rule)}
.strip div:last-child{border-right:0}
.strip b{display:block;font-size:30px;font-weight:600;line-height:1.1}
.strip span{font-family:var(--sans);font-size:13px;color:var(--ink-2)}

/* Layout */
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:60vh}
.spine{border-right:1px solid var(--rule);padding:28px 24px 48px 48px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
.spine h2{font-size:14px;font-family:var(--sans);font-weight:500;color:var(--ink-2);margin:0 0 14px}
.stop{position:relative;padding:0 0 22px 22px;border-left:1.5px solid var(--rule);margin-left:5px}
.stop:last-child{padding-bottom:0}
.stop::before{content:"";position:absolute;left:-6.5px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink)}
.stop.redteam::before{background:var(--ink)}
.stop button{text-align:left;display:block}
.stop .n{font-size:16px;font-weight:600;line-height:1.2}
.stop .p{font-size:14px;color:var(--ink-2);line-height:1.35}
.stop .marks{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.stop .marks i{display:inline-block;width:8px;height:8px;border-radius:50%}
.stop .marks i.chair{background:var(--chair)} .stop .marks i.human{background:var(--human)} .stop .marks i.conflict{background:var(--conflict)}
.legend{margin-top:24px;font-family:var(--sans);font-size:12.5px;color:var(--ink-2);line-height:1.9}

main{padding:36px 48px 80px;max-width:1060px}
section{margin-bottom:56px}
section h2{font-size:26px;font-weight:600;margin:0 0 16px;letter-spacing:-0.005em}
section h3{font-size:19px;font-weight:600;margin:28px 0 10px}
p{max-width:70ch;margin:0 0 12px}
.lead{font-size:24px;line-height:1.3;max-width:34ch;font-weight:600;margin:0 0 14px}
.muted{color:var(--ink-2)}
hr{border:0;border-top:1px solid var(--rule);margin:36px 0}

/* Tabs (audit) */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--rule);margin:0 0 28px;overflow-x:auto}
.tabs button{padding:10px 0 12px;font-family:var(--sans);font-size:14.5px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* Entries */
.entry{padding:14px 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:start}
.entry:last-child{border-bottom:1px solid var(--rule)}
.entry .who{font-family:var(--sans);font-size:13px;color:var(--ink-2);line-height:1.4;padding-top:3px}
.entry .who b{display:block;color:var(--ink);font-weight:500}
.entry .what{max-width:70ch}
.entry .what .s{font-size:17px}
.entry .what .sub{font-size:15px;color:var(--ink-2);margin-top:4px}
.entry .tags{margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.entry.ruling{border-left:3px solid var(--chair);padding-left:14px}
.entry.human{border-left:3px solid var(--human);padding-left:14px}
.entry.conflict{border-left:3px solid var(--conflict);padding-left:14px}
.entry.gap{border-left:3px dashed var(--ink-2);padding-left:14px}
.pill{font-family:var(--sans);font-size:12px;padding:2px 7px;border:1px solid var(--rule);border-radius:2px;color:var(--ink-2);background:var(--sheet)}
.pill.hi{border-color:var(--ink);color:var(--ink)} .pill.lo{color:var(--conflict);border-color:var(--conflict)}
.pill.disc{background:var(--conflict);color:var(--paper);border-color:var(--conflict)}
.pill.t0{background:var(--conflict);color:var(--paper);border-color:var(--conflict);font-weight:600}
.pill.t1{background:var(--human);color:var(--paper);border-color:var(--human)}
.pill.t2{color:var(--ink);border-color:var(--ink)}
.pill.t3{color:var(--ink-2);border-style:dashed}
.pill.chg-new{background:var(--ok);color:var(--paper);border-color:var(--ok)} .pill.chg-changed{background:var(--human);color:var(--paper);border-color:var(--human)}
body.show-changes tr.chg-new td:first-child{box-shadow:inset 4px 0 var(--ok)} body.show-changes tr.chg-changed td:first-child{box-shadow:inset 4px 0 var(--human)}
body:not(.show-changes) .chg-only{display:none}
.changes h2{margin-top:0} .changes .delta{font-family:var(--sans);font-size:14px} .changes .up{color:var(--ok)} .changes .down{color:var(--conflict)}
.tier-strip{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-family:var(--sans);font-size:13.5px;margin:14px 0 2px}
.tier-strip #jump-queue{color:var(--chair);text-decoration:underline;cursor:pointer}
.tier-jump{cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:3px 4px;border-radius:3px}
.tier-jump:hover{background:var(--sheet)}
.t0-box{border:1px solid var(--conflict);border-left-width:4px;padding:14px 16px;margin-bottom:10px}
.t0-box .s{font-size:16.5px}

/* Tables */
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-family:var(--sans);font-weight:500;font-size:13px;color:var(--ink-2);padding:8px 10px 8px 0;border-bottom:1px solid var(--ink);position:sticky;top:0;background:var(--paper);z-index:4;box-shadow:0 1px 0 var(--rule)}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--rule);vertical-align:top}
td.id{font-family:var(--sans);font-size:12.5px}
.filters{display:flex;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.filters select,.filters input{font:inherit;font-family:var(--sans);font-size:13.5px;padding:6px 8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:2px}

/* Persona grid */
.persona{padding:18px 0;border-top:1px solid var(--rule)}
.persona h3{margin:0 0 4px;font-size:19px}
.persona .rat{font-family:var(--sans);font-size:13.5px;color:var(--ink-2);max-width:70ch;margin-bottom:10px}

/* Two-column notes in narrative */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.note{border-top:2px solid var(--ink);padding-top:12px}
.note.chair{border-color:var(--chair)} .note.human{border-color:var(--human)} .note.conflict{border-color:var(--conflict)}
.note h4{margin:0 0 6px;font-size:16px;font-weight:600}
.note p{font-size:15.5px;margin-bottom:8px}

.empty{color:var(--ink-2);font-style:italic}
.hidden{display:none}

/* Evidence web: cross-references, hover cards, record drawer */
a.xref{font-family:var(--sans);font-size:.85em;color:var(--chair);text-decoration:none;border-bottom:1px dotted var(--chair);cursor:pointer;white-space:nowrap}
a.xref:hover{background:#E7EDF6}
#xtip{position:fixed;z-index:70;max-width:400px;background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--chair);box-shadow:0 8px 28px rgba(24,32,41,.16);padding:12px 14px;font-size:14.5px;line-height:1.45;pointer-events:none}
#xtip .tt-kind{font-family:var(--sans);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}
#xtip .tt-kind b{color:var(--ink)}
#xtip .tt-tags{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
#xtip .tt-hint{margin-top:7px;font-family:var(--sans);font-size:11.5px;color:var(--ink-2)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,94vw);background:var(--sheet);border-left:1px solid var(--rule);box-shadow:-14px 0 34px rgba(24,32,41,.14);z-index:60;transform:translateX(105%);transition:transform .16s ease;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer .d-bar{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--rule);font-family:var(--sans);font-size:13px}
#drawer .d-bar button{padding:4px 10px;border:1px solid var(--rule);border-radius:2px;background:var(--paper);font-size:13px}
#drawer .d-bar .d-trail{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#drawer .d-body{padding:20px 22px 40px;overflow:auto}
#drawer h3{margin:0 0 4px;font-size:21px}
#drawer .d-kind{font-family:var(--sans);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin-bottom:12px}
#drawer dl{margin:14px 0 0;font-size:15px}
#drawer dt{font-family:var(--sans);font-size:12.5px;color:var(--ink-2);margin:12px 0 3px}
#drawer dd{margin:0;max-width:60ch}
#drawer .tags{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.flash-target{animation:flashbg 1.8s ease-out}
@keyframes flashbg{0%{background:#F3E0B8}100%{background:transparent}}
@media print{#drawer,#xtip{display:none}}
@media (max-width:900px){
  header{grid-template-columns:1fr;padding:28px 20px 18px}
  header h1{font-size:30px}
  .strip{grid-template-columns:repeat(3,1fr)} .strip div{padding:14px 20px}
  .wrap{grid-template-columns:1fr} .spine{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule);padding:20px}
  main{padding:24px 20px 60px} .cols{grid-template-columns:1fr}
  .entry{grid-template-columns:1fr}
}
@media (max-width:480px){
  header{padding:16px} header h1{font-size:26px}
  .strip{grid-template-columns:repeat(2,1fr)} .strip div{padding:12px 16px}
  main{padding:20px 16px 48px} .spine{padding:16px}
}
@media (prefers-reduced-motion:no-preference){ main section{transition:opacity .15s} }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">Council ledger</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="views" role="group" aria-label="View">
    <button id="btn-exec" aria-pressed="false">Executive summary</button>
    <button id="btn-narrative" aria-pressed="true">Narrative</button>
    <button id="btn-audit" aria-pressed="false">Audit</button>
    <button id="btn-changes" aria-pressed="true" class="hidden" title="Show or hide what changed since the prior round">Changes</button>
  </div>
</header>

<div class="strip" id="strip"></div>

<div class="wrap">
  <aside class="spine">
    <h2>Phases</h2>
    <div id="spine"></div>
    <div class="legend">
      <div><span class="mark chair"></span>Chair ruled</div>
      <div><span class="mark human"></span>Principal asked</div>
      <div><span class="mark conflict"></span>Sources disagreed</div>

  <main>
    <div id="view-exec" class="hidden"></div>
    <div id="view-narrative"></div>
    <div id="view-audit" class="hidden">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="tabpanel"></div>
    </div>
  </main>
</div>

<div id="xtip" class="hidden" role="tooltip"></div>
<aside id="drawer" aria-label="Record">
  <div class="d-bar">
    <button id="d-back" title="Back">&#8592; Back</button>
    <span class="d-trail" id="d-trail"></span>
    <button id="d-audit" title="Show this record in the Audit view">Show in Audit</button>
    <button id="d-close" title="Close">&#10005;</button>

  <div class="d-body" id="d-body"></div>
</aside>

  if (gp.length) h += `<h3>Could not find</h3>` + gp.map(x => `<div class="entry gap"><div class="who"><b>${esc(x.id)}</b></div><div class="what"><div class="s">${esc(x.expected)}</div><div class="sub">${esc(x.why_expected)}</div></div></div>`).join('');
  if (openq.length) h += `<h3>Open questions</h3>` + openq.map(q => `<p><span class="id">${esc(q.id)}</span> ${esc(q.question)} <span class="muted">— ${esc(q.owner)}</span></p>`).join('');
  if (!gp.length && !openq.length) h += '<p class="empty">Nothing open.</p>';
  h += `</section>`;
  return h;
}

/* ---- Evidence web: every ledger ID is a cross-reference. Hover previews the
   record; click opens the full record card; every ID inside a card is itself
   live, so the principal can chain summary -> finding -> evidence -> source. ---- */
const KIND = {E:'Evidence', F:'Finding', C:'Conflict', R:'Chair ruling', J:'Judgment call for the principal', G:'Gap', H:'Handoff', Q:'Open question'};
const INDEX = {};
[[evidence],[findings],[conflicts],[rulings],[calls],[gaps],[handoffs],[openq]].forEach(([arr]) => arr.forEach(r => { if (r && r.id) INDEX[r.id] = r; }));
const ID_RE = /\b[EFCRJGHQ]-\d{1,4}\b/g;

/* Citation graph, built by scanning every record for IDs it mentions. */
const REFS = {}, CITED = {};
Object.entries(INDEX).forEach(([id, r]) => {
  const out = [...new Set((JSON.stringify(r).match(ID_RE) || []).filter(x => x !== id && INDEX[x]))];
  REFS[id] = out;
  out.forEach(x => { (CITED[x] = CITED[x] || []).push(id); });
});

const kindOf = id => KIND[id[0]] || 'Record';
const TIER_LABEL = {0:'Must-have',1:'High-value',2:'Useful',3:'Nice-to-have'};
const tierPill = t => (t == null) ? '' : `<span class="pill t${t}">T${t} · ${esc(TIER_LABEL[t] || '')}</span>`;
const byTier = (a, b) => (a.tier ?? 9) - (b.tier ?? 9);

/* Principal's queue: every open ask across the ledger, one list, tiered.
   Decisions = all judgment_calls. Documents = gaps raised to the principal.
   Conflicts = conflicts the chair has not resolved. */
const QUEUE = [
  ...calls.map(x => ({id: x.id, kind: 'Decision', tier: x.tier, text: x.question, status: x.answer ? 'answered' : 'open'})),
  ...gaps.filter(g => g.raised_to_principal).map(g => ({id: g.id, kind: 'Document', tier: g.tier, text: g.expected, status: g.status})),
  ...conflicts.filter(c => !c.resolved_by || c.resolved_by === 'unresolved').map(c => ({id: c.id, kind: 'Conflict', tier: c.tier, text: c.description, status: 'unresolved'}))
].sort(byTier);
const tierCounts = [0,1,2,3].map(t => QUEUE.filter(x => x.tier === t).length);
const trunc = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s; };
const gist = r => r.statement || r.claim || r.description || r.question || r.decision || r.expected || r.item || '';

/* Linkify: replace ID tokens in text nodes with xref anchors. */
let linkifyBusy = false;
function linkifyNode(root) {
  if (!root || linkifyBusy) return;
  linkifyBusy = true;
  try {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: n => {
        if (!ID_RE.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
        const p = n.parentElement;
        if (!p || p.closest('a, script, style, #xtip, .d-bar, select, option, button')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      const frag = document.createDocumentFragment();
      let last = 0; const text = n.nodeValue;
      text.replace(ID_RE, (m, off) => {
        if (!INDEX[m]) return m;
        frag.appendChild(document.createTextNode(text.slice(last, off)));
        const a = document.createElement('a');
        a.className = 'xref'; a.dataset.id = m; a.textContent = m; a.href = 'javascript:void(0)';
        frag.appendChild(a); last = off + m.length; return m;
      });
      if (!frag.childNodes.length) return;
      frag.appendChild(document.createTextNode(text.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });
  } finally { linkifyBusy = false; }
}
new MutationObserver(muts => {
  if (linkifyBusy) return;
  muts.forEach(m => m.addedNodes.forEach(n => {
    if (n.nodeType === 1 && !n.closest('#xtip')) linkifyNode(n);
    else if (n.nodeType === 3 && n.parentElement && !n.parentElement.closest('#xtip')) linkifyNode(n.parentElement);
  }));
}).observe(document.body, {childList: true, subtree: true});

/* Hover card */
const xtip = document.getElementById('xtip');
function tipHTML(id) {
  const r = INDEX[id]; if (!r) return '';
  const tags = [];
  if (r.status) tags.push(r.status);
  if (r.confidence) tags.push(r.confidence + ' confidence');
  if (r.evidence_strength) tags.push(r.evidence_strength);
  if (r.source_tier) tags.push(r.source_tier + (r.reliability ? ' · grade ' + r.reliability : ''));
  if (r.confidence_real) tags.push(r.confidence_real + ' confidence it’s real');
  if (r.public_disclosure_relevant) tags.push('public disclosure');
  const src = (r.evidence_ids || []).length ? `<div class="tt-hint">Evidence: ${r.evidence_ids.slice(0,6).join(', ')}${r.evidence_ids.length>6?' …':''}</div>` : '';
  return `<div class="tt-kind"><b>${esc(id)}</b> · ${esc(kindOf(id))}${r.persona ? ' · ' + esc(name(r.persona)) : ''}</div>
    <div>${esc(trunc(gist(r), 260))}</div>
    ${r.so_what ? `<div class="muted" style="margin-top:5px;font-size:13.5px">So what: ${esc(trunc(r.so_what, 160))}</div>` : ''}
    ${tags.length ? `<div class="tt-tags">${tags.map(t => `<span class="pill">${esc(t)}</span>`).join('')}</div>` : ''}
    ${src}<div class="tt-hint">Click to open the full record.</div>`;
}
document.addEventListener('mouseover', e => {
  const a = e.target.closest('a.xref'); if (!a) return;
  xtip.innerHTML = tipHTML(a.dataset.id);
  xtip.classList.remove('hidden');
  const r = a.getBoundingClientRect(), tw = Math.min(400, window.innerWidth - 24);
  let x = Math.min(r.left, window.innerWidth - tw - 12), y = r.bottom + 8;
  xtip.style.left = Math.max(12, x) + 'px';
  xtip.style.top = y + 'px';
  const th = xtip.getBoundingClientRect().height;
  if (y + th > window.innerHeight - 8) xtip.style.top = Math.max(8, r.top - th - 8) + 'px';
});
document.addEventListener('mouseout', e => { if (e.target.closest && e.target.closest('a.xref')) xtip.classList.add('hidden'); });

/* Record drawer with chain navigation */
const drawer = document.getElementById('drawer'), dbody = document.getElementById('d-body'), dtrail = document.getElementById('d-trail');
let trail = [];
const dd = (t, v) => v ? `<dt>${t}</dt><dd>${v}</dd>` : '';
const list = ids => (ids || []).join(', ');
function recordHTML(id) {
  const r = INDEX[id]; if (!r) return '<p class="empty">Record not found.</p>';
  let h = `<div class="d-kind">${esc(kindOf(id))}${chgPill(id)}${(r.phase ?? r.round) != null ? ' · phase ' + esc(r.phase ?? r.round) : ''}${r.persona ? ' · ' + esc(name(r.persona)) : ''}${r.recorded_by ? ' · recorded by ' + esc(name(r.recorded_by)) : ''}</div>`;
  h += `<h3>${esc(id)}</h3>`;
  h += `<p style="font-size:17px">${esc(gist(r))}</p>`;
  const tags = [];
  if (r.status) tags.push(r.status);
  if (r.confidence) tags.push(r.confidence + ' confidence');
  if (r.evidence_strength) tags.push('evidence: ' + r.evidence_strength);
  if (r.source_tier) tags.push('tier ' + r.source_tier);
  if (r.reliability) tags.push('grade ' + r.reliability);
  if (r.confidence_real) tags.push(r.confidence_real + ' confidence it’s real');
  if (r.public_disclosure_relevant) tags.push('public disclosure question');
  if (tags.length) h += `<div class="tags">${tags.map(t => `<span class="pill">${esc(t)}</span>`).join('')}</div>`;
  h += '<dl>';
  if (r.tier != null) h += dd('Priority tier', tierPill(r.tier) + (r.tier_rationale ? ' ' + esc(r.tier_rationale) : ''));
  h += dd('So what', r.so_what && esc(r.so_what));
  h += dd('Why the principal', r.why_principal && esc(r.why_principal));
  h += dd('Options', (r.options || []).length ? r.options.map(esc).join(' · ') : '');
  h += dd('Answer', r.answer && esc(r.answer));
  h += dd('Impact', r.impact && esc(r.impact));
  h += dd('Ruled on', r.on && esc(r.on));
  h += dd('Rationale', r.rationale && esc(r.rationale));
  h += dd('Values in conflict', (r.values || []).length ? r.values.map(v => `<div><span class="tag">${esc(v.source_tier)}</span> ${esc(v.value)}</div>`).join('') : '');
  h += dd('Likely cause', r.likely_cause && esc(r.likely_cause));
  h += dd('Resolution', r.resolution ? esc(r.resolution) + ` <span class="muted">(${esc(r.resolved_by || 'unresolved')})</span>` : '');
  h += dd('Dissent', (r.dissent || []).length ? r.dissent.map(d => `${esc(name(d.persona))}: ${esc(d.note)}`).join('<br>') : '');
  h += dd('Contested by', (r.contested_by || []).length ? r.contested_by.map(c => `${esc(name(c.persona))} — ${esc(c.note)}`).join('<br>') : '');
  h += dd('Why expected', r.why_expected && esc(r.why_expected));
  h += dd('Searched', (r.searched || []).length ? r.searched.map(esc).join('<br>') : '');
  h += dd('Handoff', r.from ? `${esc(name(r.from))} → ${esc(name(r.to))}${r.why ? ' — ' + esc(r.why) : ''}` : '');
  h += dd('Owner', r.owner && esc(r.owner));
  if (r.locator) h += dd('Source', /^https?:/.test(r.locator) ? `<a href="${esc(r.locator)}" target="_blank" rel="noopener">${esc(r.locator)}</a>` : esc(r.locator));
  h += dd('Retrieved', r.retrieved && esc(String(r.retrieved).slice(0,10)) + (r.reverified ? ` · re-verified ${esc(String(r.reverified).slice(0,10))}` : ''));
  h += dd('Carried from', r.carried_from && esc(r.carried_from));
  h += dd('Supporting evidence', list(r.evidence_ids));
  h += dd('References', list((REFS[id] || []).filter(x => !(r.evidence_ids || []).includes(x))));
  h += dd('Cited by', list(CITED[id]));
  h += '</dl>';
  return h;
}
function renderRecord() {
  const id = trail[trail.length - 1]; if (!id) return;
  dbody.innerHTML = recordHTML(id);
  linkifyNode(dbody);
  dtrail.textContent = trail.join('  ›  ');
  document.getElementById('d-back').style.visibility = trail.length > 1 ? 'visible' : 'hidden';
  drawer.classList.add('open');
  dbody.scrollTop = 0;
}
function openRecord(id) {
  if (!INDEX[id]) return;
  if (drawer.classList.contains('open')) trail.push(id); else trail = [id];
  renderRecord();
}
document.addEventListener('click', e => {
  const a = e.target.closest('a.xref'); if (!a) return;
  e.preventDefault(); xtip.classList.add('hidden');
  openRecord(a.dataset.id);
});
document.getElementById('d-close').onclick = () => { drawer.classList.remove('open'); trail = []; };
document.getElementById('d-back').onclick = () => { if (trail.length > 1) { trail.pop(); renderRecord(); } };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { drawer.classList.remove('open'); trail = []; xtip.classList.add('hidden'); } });
document.getElementById('d-audit').onclick = () => {
  const id = trail[trail.length - 1]; if (!id) return;
  const tabFor = {E: 6, F: 3, C: 4, R: 5, J: 5, G: 7, Q: 7, H: 1};
  setView('audit'); activeTab = tabFor[id[0]] ?? 0; renderTabs(); audit(activeTab);
  drawer.classList.remove('open'); trail = [];
  requestAnimationFrame(() => {
    const panel = document.getElementById('tabpanel');
    const el = [...panel.querySelectorAll('td, .who, .entry, span')].find(x => x.textContent.trim() === id || x.textContent.trim().startsWith(id));
    const row = el && (el.closest('tr') || el.closest('.entry') || el);
    if (row) { row.scrollIntoView({behavior: 'smooth', block: 'center'}); row.classList.add('flash-target'); setTimeout(() => row.classList.remove('flash-target'), 2000); }
  });
};

/* Wiring */
document.getElementById('view-exec').innerHTML = execView();
document.getElementById('view-narrative').innerHTML = narrative();
renderTabs(); audit(0);
const setView = v => {
  document.getElementById('view-exec').classList.toggle('hidden', v!=='exec');
  document.getElementById('view-narrative').classList.toggle('hidden', v!=='narrative');
  document.getElementById('view-audit').classList.toggle('hidden', v!=='audit');
  document.getElementById('btn-exec').setAttribute('aria-pressed', v==='exec');
  document.getElementById('btn-narrative').setAttribute('aria-pressed', v==='narrative');
  document.getElementById('btn-audit').setAttribute('aria-pressed', v==='audit');
};
const chgBtn = document.getElementById('btn-changes');
if (CH) { chgBtn.classList.remove('hidden'); document.body.classList.add('show-changes'); chgBtn.onclick = () => { const on = !document.body.classList.contains('show-changes'); document.body.classList.toggle('show-changes', on); chgBtn.setAttribute('aria-pressed', on); }; }
document.getElementById('btn-exec').onclick = () => setView('exec');
document.getElementById('btn-narrative').onclick = () => setView('narrative');
document.getElementById('btn-audit').onclick = () => setView('audit');
if (xs) { setView('exec'); } else { document.getElementById('btn-exec').style.display = 'none'; }
const jumpQueue = document.getElementById('jump-queue');
if (jumpQueue) jumpQueue.onclick = () => { setView('audit'); activeTab = 0; renderTabs(); audit(0); };
document.querySelectorAll('.tier-jump').forEach(a => a.onclick = () => {
  setView('audit'); activeTab = 0; renderTabs(); audit(0);
  const sel = document.getElementById('q-tier'); if (!sel) return;
  sel.value = a.dataset.tier; sel.dispatchEvent(new Event('input', {bubbles: true}));
});
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; activeTab = +b.dataset.i; renderTabs(); audit(activeTab); });
document.getElementById('spine').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const n = b.dataset.round;
  setView('audit'); activeTab = 1; renderTabs(); audit(1);
  requestAnimationFrame(() => {
    const el = document.getElementById('round-'+n); if (!el) return;
    el.scrollIntoView({behavior: 'smooth', block: 'start'});
    el.classList.add('flash-target'); setTimeout(() => el.classList.remove('flash-target'), 2000);
  }); });
</script>
</body>
</html>
